key: workshops-op-locatie
question: Geeft Ina ook workshops of gastlessen op locatie?
answer: |
  Ja. Naast workshops in het atelier in Aalten geeft Ina gastlessen en programma’s op locatie.
  Samen stellen we een passend programma samen, of het nu gaat om een vereniging,
  een school of een groepsuitje in de Achterhoek.
