key: rolstoel-adaptief
question: Maakt Ina ook kleding voor mensen in een rolstoel of met een afwijkende maat?
answer: |
  Ja. Omdat elk kledingstuk op jouw maten wordt gemaakt, is dit juist een uitkomst
  als confectie slecht valt. Ina maakt onder andere rolstoelcapes en andere kleding
  die écht past.
