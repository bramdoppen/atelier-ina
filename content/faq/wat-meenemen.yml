key: wat-meenemen
question: Wat moet ik meenemen naar de naailes?
answer: |
  Naaimachines, een lockmachine en strijkapparatuur zijn in het atelier aanwezig.
  Je mag ook je eigen naaimachine meenemen als je daar liever mee werkt.
  Stof en toebehoren voor je eigen project neem je zelf mee, of we overleggen vooraf wat je nodig hebt.
