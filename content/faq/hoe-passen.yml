key: hoe-passen
question: Hoe gaat een pasafspraak voor kleding op maat in zijn werk?
answer: |
  Voor het maken van de kleding plannen we meestal drie afspraken in.

  Tijdens de eerste afspraak wordt het gewenste ontwerp en de materiaalkeuze
  besproken. Ook worden de maten opgenomen. Aan de hand hiervan wordt een patroon
  gemaakt. Met dit patroon maak ik de toile, het proefmodel.

  Tijdens de tweede afspraak wordt dit proefmodel gepast en eventueel nog aangepast.

  Tijdens de derde (pas-)afspraak is het model al in de gewenste stof gemaakt en
  kunnen er nog kleine veranderingen aangebracht worden.

  Wanneer alles naar tevredenheid is en het kledingstuk goed zit, wordt het
  kledingstuk afgemaakt.
