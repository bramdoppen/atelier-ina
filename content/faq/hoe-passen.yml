key: hoe-passen
question: Hoe gaat een pasafspraak voor kleding op maat in zijn werk?
answer: |
  We plannen meestal drie afspraken. Bij de eerste afspraak bespreken we het ontwerp
  en de stof, en worden je maten opgenomen. Daarna maakt Ina een toile (proefmodel).
  Bij de tweede afspraak pas je dat proefmodel. Bij de derde afspraak is het kledingstuk
  al in de gewenste stof gemaakt en kunnen nog kleine aanpassingen worden gedaan.
