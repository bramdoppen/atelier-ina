key: levertijd
question: Hoe lang duurt het voordat een kledingstuk klaar is?
answer: |
  Dat hangt af van het ontwerp, de stofkeuze en hoe vol de agenda is.
  Reken voor de meeste kledingstukken op meerdere weken, omdat er drie pasafspraken
  tussendoor zitten. Voor een feest of speciale datum is het verstandig op tijd te beginnen.
  Neem contact op, dan kijken we samen naar een realistische planning.
