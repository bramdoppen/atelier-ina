seo:
  title: Kleding op maat - Ina Lubbers Lensink
  description: Naailessen, workshops en kleding op maat in Aalten. Ina Lubbers maakt van ieder lapje stof iets moois, voor klanten uit de hele Achterhoek.
sections:
  - type: pageHeader
    heading: "Naailes, workshops en kleding op maat:"
    tint: Ina Lubbers
  - type: aboutBlock
    heading: Over Ina Lubbers
    portrait: /images/afpassen.jpg
    portraitAlt: Ina Lubbers past een kledingstuk af
    landscape: /images/rits.jpg
    landscapeAlt: Detail van een rits
    body: |
      In het Achterhoekse Aalten geeft Ina Lubbers al jaren naailessen aan mensen die graag zelf kleding willen maken.

      Al tijdens haar jeugd altijd in de weer met lapjes, stoffen en garens is haar hobby uitgegroeid tot een echte Modevakschool, sinds 1996. Met veel enthousiasme en kennis van zaken maakt Ina van ieder lapje stof iets moois.

      Door middel van verschillende cursussen en bijscholingen breidt ze haar kennis steeds verder uit. Vanuit haar atelier op de grens van Aalten en Lichtenvoorde ontvangt ze cursisten en klanten uit Winterswijk, Bredevoort, Doetinchem en de rest van de Achterhoek.
  - type: contentBlock
    heading: Wekelijkse naailessen
    reversed: true
    image: /images/pexels_evelina_zhu_5_DW90k.jpg
    imageAlt: Stoffen en naaiwerk in het atelier
    cta:
