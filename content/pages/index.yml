      link: /naailessen
    body: |
      Met veel energie geeft Ina Lubbers elke week les in het Achterhoekse Aalten. Haar atelier staat precies op de grens tussen Lichtenvoorde en Aalten in.
  - type: contentBlock
    heading: Kleding op maat
    image: /images/pexels_cottonbro_462_SCtgN.jpg
    imageAlt: Naaimachine in het atelier
    cta:
      label: Meer informatie
      link: /kleding-op-maat
    body: |
      Een uniek kledingstuk voor een feestelijke gelegenheid, of omdat het lastig is om kleding te vinden in jouw eigen maat? Ik maak graag een passend kledingstuk voor jou!
  - type: contentBlock
