title: Kleding op maat
slug: /kleding-op-maat
seo:
  title: Jouw kleding op maat - Ina Lubbers Lensink
  description: Uniek kledingstuk op jouw maten, gemaakt in Aalten. Van feestjurk tot dagelijkse kleding en rolstoelcape. Drie pasafspraken, aandacht voor elk detail.
sections:
  - type: pageHeader
    heading: Kleding op maat
    small: true
  - type: contentBlock
    reversed: true
    image: /images/bijgesneden_ina.jpg
    imageAlt: Ina Lubbers in het atelier
    body: |
      Ik maak graag een uniek kledingstuk voor je, voor elke gelegenheid, op jouw eigen maten. Dit kan voor een feestelijke gelegenheid zijn, of een uniek item om dagelijks te dragen.

      Omdat het kledingstuk precies gemaakt is op jouw maat, is dit ook een uitkomst voor klanten voor wie het lastig is om kleding te vinden in hun eigen maat.
  - type: steps
    heading: Hoe gaat dit in zijn werk?
    intro: Voor het maken van de kleding plannen we meestal drie afspraken in.
    steps:
      - Tijdens de eerste afspraak wordt het gewenste ontwerp en de materiaalkeuze besproken. Ook worden de maten opgenomen. Aan de hand hiervan wordt een patroon gemaakt. Met dit patroon maak ik de toile, het proefmodel.
      - Tijdens de tweede afspraak wordt dit proefmodel gepast en eventueel nog aangepast.
      - Tijdens de derde (pas-)afspraak is het model al in de gewenste stof gemaakt en kunnen er nog kleine veranderingen aangebracht worden.
    outro: Wanneer alles naar tevredenheid is en het kledingstuk goed zit, wordt het kledingstuk afgemaakt.
